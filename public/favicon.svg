<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Space Gray / Titanium Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22252e" />
      <stop offset="50%" stop-color="#14161c" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Bevel Border Gradient -->
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <!-- macOS Blue Gradient -->
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>

    <!-- Frost Pane Gradient -->
    <linearGradient id="paneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- macOS Continuous Curve Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="448" rx="108" stroke="url(#bevelGrad)" stroke-width="3" />

  <!-- Grid Cells (Representing 4-pane terminal matrix) -->
  <!-- Top Left Pane (Active with Apple Accent) -->
  <rect x="88" y="88" width="156" height="156" rx="28" fill="#161922" stroke="url(#blueAccent)" stroke-width="3" stroke-opacity="0.9" />
  <!-- Terminal Prompt glyph > in active pane -->
  <path d="M136 144 L164 166 L136 188" stroke="#2997ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="178" y1="184" x2="204" y2="184" stroke="#2997ff" stroke-width="7" stroke-linecap="round"/>

  <!-- Top Right Pane -->
  <rect x="268" y="88" width="156" height="156" rx="28" fill="url(#paneGrad)" stroke="rgba(255,255,255,0.09)" stroke-width="2" />
  <!-- Subtle line mockups -->
  <line x1="296" y1="136" x2="368" y2="136" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>
  <line x1="296" y1="156" x2="396" y2="156" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
  <line x1="296" y1="176" x2="348" y2="176" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>

  <!-- Bottom Left Pane -->
  <rect x="88" y="268" width="156" height="156" rx="28" fill="url(#paneGrad)" stroke="rgba(255,255,255,0.09)" stroke-width="2" />
  <line x1="116" y1="316" x2="188" y2="316" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>
  <line x1="116" y1="336" x2="216" y2="336" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
  <line x1="116" y1="356" x2="168" y2="356" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>

  <!-- Bottom Right Pane -->
  <rect x="268" y="268" width="156" height="156" rx="28" fill="url(#paneGrad)" stroke="rgba(255,255,255,0.09)" stroke-width="2" />
  <line x1="296" y1="316" x2="378" y2="316" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>
  <line x1="296" y1="336" x2="356" y2="336" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
  <line x1="296" y1="356" x2="396" y2="356" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
</svg>